<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Ambient background layers -->
    <div class="bg-layer"></div>
    <div class="bg-noise"></div>
    <div class="bg-vignette"></div>
    <header>
        <div class="header-inner">
            <div class="logo-group">
                <span class="logo-icon">▶</span>
                <h1>MOVIE<span class="logo-accent">EXPLORER</span></h1>
            </div>

            <form id="searchForm" class="search-form">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" ...>
                    <button type="submit" class="search-btn">
                        <span>BUSCAR</span>
                    </button>
                </div>
            </form>

            <nav class="nav-extras">
                <a href="favorites.html" class="nav-fav-link">
                    <span class="fav-count-badge" id="fav-count">0</span>
                    <span class="fav-nav-icon">❤️</span>
                    <span class="fav-nav-text">Favoritos</span>
                </a>
            </nav>
        </div>
        <div class="header-line"></div>
    </header>
    <main>
        <section id="filters" class="filters-section">
            <div class="filters-label">GÉNEROS</div>
            <div class="filters-track">
                <button class="filter-btn active" data-genre="All">
                    <span class="filter-dot"></span>Todos
                </button>
                <button class="filter-btn" data-genre="Drama">
                    <span class="filter-dot"></span>Drama
                </button>
                <button class="filter-btn" data-genre="Comedy">
                    <span class="filter-dot"></span>Comedia
                </button>
                <button class="filter-btn" data-genre="Action">
                    <span class="filter-dot"></span>Acción
                </button>
                <button class="filter-btn" data-genre="Thriller">
                    <span class="filter-dot"></span>Thriller
                </button>
                <button class="filter-btn" data-genre="Sci-Fi">
                    <span class="filter-dot"></span>Sci-Fi
                </button>
            </div>
        </section>
        <section id="shows" class="shows-grid"></section>
        <section id="pagination" class="pagination-section">
            <button id="prev" class="page-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Anterior
            </button>
            <div class="page-info">
                <span id="pageIndicator" class="page-indicator"></span>
            </div>
            <button id="next" class="page-btn next">
                Siguiente
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
            <div class="per-page-wrap">
                <label>Por página</label>
                <select id="itemsPerPage" class="items-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-inner">
            <span class="footer-logo">▶ MOVIEEXPLORER</span>
            <span class="footer-copy">Todos los derechos reservados © 2025</span>
        </div>
    </footer>
    <script type="module" src="js/main.js"></script>
</body>

</html>
